allowBuilds:
  esbuild: true

# Our own packages are exempt from the release-age gate.
#
# That gate exists to keep a third-party package published minutes ago out of the tree — the window
# a supply-chain attack lives in. It makes no sense against packages we publish ourselves, where the
# normal flow is release then immediately consume, which is exactly what it rejects.
#
# Entries used to be version-pinned, so every release of our own needed another line added by hand,
# and the failure surfaced later, mid-install, on an unrelated command. Three times in one day.
minimumReleaseAgeExclude:
  - '@finografic/*'
